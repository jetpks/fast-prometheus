name: Release

on:
  push:
    tags:
      - "v*"
  # Dry-run: build + verify the packaged gem without publishing anything.
  workflow_dispatch:

jobs:
  release:
    name: Build and publish gem
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token for RubyGems trusted publishing
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      PROMETHEUS_VERSION: "3.14.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4

      - name: Build gem
        run: |
          gem build fast-prometheus.gemspec
          mkdir -p pkg/
          mv *.gem pkg/

      # The integration harness needs a real prometheus + promtool for its
      # E2E checks; the runner image has neither, so fetch the release tarball.
      - name: Install Prometheus for the integration harness
        run: |
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          dir="$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          echo "PROMETHEUS_BIN=$dir/prometheus" >> "$GITHUB_ENV"
          echo "PROMTOOL_BIN=$dir/promtool" >> "$GITHUB_ENV"
          "$dir/promtool" --version

      # The pre-release rule (docs/how-to/verify-a-release.md): the harness
      # installs the built .gem into an isolated GEM_HOME and exercises every
      # require path, the public surface and a real Prometheus scrape from
      # there — the checkout's lib/ is never on the load path. E2E_REQUIRED=1
      # turns a skipped check into a failure.
      - name: Verify the packaged gem
        run: E2E_REQUIRED=1 ./integration/run pkg/fast-prometheus-*.gem

      # Trusted publishing: no API token. Auth is a short-lived OIDC
      # credential minted at run time, scoped to this repo + workflow
      # (rubygems.org trusted publisher: jetpks/fast-prometheus, release.yml).
      - name: Configure RubyGems credentials
        if: ${{ fromJSON(env.IS_TAG) }}
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Publish to RubyGems
        if: ${{ fromJSON(env.IS_TAG) }}
        run: gem push pkg/fast-prometheus-*.gem

      - name: Smoke-test the published gem
        if: ${{ fromJSON(env.IS_TAG) }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            gem install fast-prometheus --version "$version" && break
            echo "not indexed yet (attempt $attempt) — retrying in 15s"
            sleep 15
          done
          ruby -e 'require "fast/prometheus"; require "fast/prometheus/rack/exporter"; puts Fast::Prometheus::VERSION' | grep -Fx "$version"

      - name: Create GitHub Release
        if: ${{ fromJSON(env.IS_TAG) }}
        uses: softprops/action-gh-release@v3
        with:
          files: pkg/*.gem
          generate_release_notes: true
          # Prerelease tags (e.g. v0.1.0.pre.1) must not be marked "latest".
          prerelease: ${{ contains(github.ref_name, '.rc') || contains(github.ref_name, '.beta') || contains(github.ref_name, '.alpha') || contains(github.ref_name, '.pre') || contains(github.ref_name, '-') }}
