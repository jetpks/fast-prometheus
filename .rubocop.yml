AllCops:
  TargetRubyVersion: 3.4
  NewCops: disable
  SuggestExtensions: false
Layout/LineLength:
  Max: 120
Style/Documentation:
  Enabled: false
Metrics:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: double_quotes
Bundler/GemFilename:
  Enabled: false
Gemspec/OrderedDependencies:
  Enabled: false
Bundler/OrderedGems:
  Enabled: false
Style/MixinUsage:
  Enabled: false
